<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>R.N & CO Technical Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16294D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="R.N & CO">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ECECE8;--surface:#FFFFFF;--ink:#151515;--muted:#5C5C57;--line:#D6D6D0;--field:#F5F5F2;
  --yellow:#F7C310;--primary:#16294D;--on-primary:#FFFFFF;--danger:#B3261E;--ok:#1E7B3A;
  --head:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F0F;--surface:#1A1A1A;--ink:#F2F2EE;--muted:#A6A6A0;--line:#343432;--field:#242422;
    --primary:#F7C310;--on-primary:#151515;--danger:#FF8A80;--ok:#6FD08A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0F0F;--surface:#1A1A1A;--ink:#F2F2EE;--muted:#A6A6A0;--line:#343432;--field:#242422;
  --primary:#F7C310;--on-primary:#151515;--danger:#FF8A80;--ok:#6FD08A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#16294D;color:#fff;border-bottom:4px solid var(--yellow)}
.top .wrap{display:flex;align-items:center;gap:10px;height:54px}
.top h1{font-family:var(--head);font-weight:700;font-size:22px;margin:0;letter-spacing:.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:transparent;border:0;color:inherit;width:44px;height:44px;display:grid;place-items:center;border-radius:8px}
.top .iconbtn:hover{background:#243b66}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{padding:16px 0 120px}

/* home */
.hero{background:#16294D;color:#fff;padding:22px 0 26px;border-bottom:4px solid var(--yellow)}
.hero .wrap{display:flex;gap:16px;align-items:center}
.logochip{width:84px;height:84px;background:#fff;border-radius:10px;display:grid;place-items:center;flex:none;padding:5px}
.logochip img{width:100%;height:100%;object-fit:contain}
.hero h2{font-family:var(--head);font-size:40px;line-height:1;margin:0;font-weight:700}
.hero p{margin:6px 0 0;color:#cfcfc8;font-size:15px}
.hero .sub{font-family:var(--head);font-size:20px;font-weight:600;color:var(--yellow);margin-top:4px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--yellow);color:#151515;border:0;border-radius:10px;padding:22px 16px;font-family:var(--head);font-weight:700;font-size:28px;margin:18px 0 12px;box-shadow:0 4px 0 #16294D}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #151515}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:88px}
.tile b{font-family:var(--head);font-size:30px;line-height:1}
.tile span{font-size:14px;color:var(--muted)}
h3.sec{font-family:var(--head);font-size:22px;margin:24px 0 8px;font-weight:700}

/* forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label.f{display:block;margin-bottom:12px;font-weight:500;font-size:14px;color:var(--muted)}
label.f:last-child{margin-bottom:0}
.inp,select.inp,textarea.inp{display:block;width:100%;margin-top:4px;background:var(--field);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;font-size:16px;color:var(--ink);min-height:46px}
.inp:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(247,195,16,.6)}
textarea.inp{min-height:120px;resize:vertical}
.req{color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}

.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:7px;padding:11px 4px;font-weight:600;font-size:15px;color:var(--muted);min-height:44px}
.tabs button[aria-selected="true"]{background:var(--primary);color:var(--on-primary)}

.item{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--yellow);border-radius:10px;padding:12px;margin-bottom:12px}
.item-h{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.item-h .no{font-family:var(--head);font-size:24px;font-weight:700;width:30px;flex:none;line-height:46px;text-align:center}
.item-h .inp{margin-top:0;flex:1}
.item .acts{display:flex;gap:4px;flex:none}
.item .acts .iconbtn{width:40px;height:46px;border:1px solid var(--line);color:var(--ink)}
.item .acts .iconbtn.del{color:var(--danger)}
.amt{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:var(--muted);font-size:14px}
.amt b{font-family:var(--head);font-size:24px;color:var(--ink)}
.addbtn{width:100%;border:2px dashed var(--ink);background:transparent;border-radius:10px;padding:16px;font-family:var(--head);font-weight:700;font-size:22px;color:var(--ink);min-height:56px}

.chg{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.chg:last-child{border-bottom:0}
.chg .nm{flex:1;font-weight:500}
.chg .inp{margin-top:0;width:130px;text-align:right}
.sw{width:22px;height:22px;accent-color:var(--primary)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{position:relative;flex:1;min-width:110px;border:1.5px solid var(--line);border-radius:8px;padding:11px;text-align:center;font-weight:600;cursor:pointer;background:var(--field)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--on-primary)}
.seg label:has(input:checked){background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.seg label:has(input:focus-visible){outline:3px solid var(--yellow);outline-offset:2px}

.sumrow{display:flex;justify-content:space-between;padding:6px 0}
.sumrow.big{border-top:2px solid var(--ink);margin-top:6px;padding-top:12px;font-family:var(--head);font-size:28px;font-weight:700}
.words{color:var(--muted);font-size:14px;margin-top:4px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;gap:10px;align-items:center}
.bar .tot{flex:1;min-width:0}
.bar .tot small{display:block;color:var(--muted);font-size:13px;line-height:1.1}
.bar .tot b{font-family:var(--head);font-size:28px;line-height:1.1;white-space:nowrap}
.btn{border:0;background:var(--primary);color:var(--on-primary);border-radius:10px;padding:0 20px;min-height:52px;font-family:var(--head);font-weight:700;font-size:20px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.yel{background:var(--yellow);color:#151515}
.btn.sm{min-height:42px;font-size:16px;padding:0 14px;border-radius:8px}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn[disabled]{opacity:.5}

/* list */
.search{position:relative;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.est{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px;margin-bottom:10px}
.est .r1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.est .cl{font-weight:600;font-size:17px}
.est .meta{color:var(--muted);font-size:14px}
.est .tt{font-family:var(--head);font-size:24px;font-weight:700;white-space:nowrap}
.pill{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;border:1.5px solid currentColor}
.pill.draft{color:var(--muted)}.pill.completed{color:var(--ok)}.pill.sent{color:#2B6CB0}
:root[data-theme="dark"] .pill.sent{color:#8AB8F0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.sent{color:#8AB8F0}}
.est .row-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.est select.inp{width:auto;margin:0 0 0 auto;min-height:40px;padding:6px 8px;font-size:14px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;font-family:var(--head);font-size:24px;color:var(--ink);margin-bottom:4px}

/* paper preview */
.paperwrap{overflow-x:auto;padding-bottom:6px}
.paper{background:#fff;color:#151515;min-width:560px;padding:22px 22px 26px;box-shadow:0 2px 14px rgba(0,0,0,.25);font-size:13.5px;line-height:1.35}
.ph{display:flex;gap:14px;align-items:flex-start}
.ph img{width:74px;height:auto;flex:none}
.ph h2{font-family:var(--head);font-size:34px;margin:0;line-height:1;font-weight:700}
.ph .tg{font-weight:600;letter-spacing:.06em;font-size:12px;color:#444;text-transform:uppercase;margin:2px 0 6px}
.ph p{margin:0;color:#3b3b3b;font-size:12.5px}
.bars{height:4px;background:#151515;border-bottom:4px solid #F7C310;margin:12px 0 14px;box-sizing:content-box}
.ptitle{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.ptitle h3{font-family:var(--head);font-size:28px;margin:0;font-weight:700}
.ptitle div{text-align:right}
.kv{display:grid;grid-template-columns:110px 1fr;gap:2px 8px;margin-bottom:12px}
.kv b{font-weight:600}
.paper table{width:100%;border-collapse:collapse;font-size:12.5px}
.paper th{background:#151515;color:#F7C310;text-align:left;padding:7px 6px;font-weight:600}
.paper td{padding:6px;border:1px solid #d3d3cc;vertical-align:top}
.paper tr:nth-child(even) td{background:#f7f7f4}
.paper .r{text-align:right}.paper .c{text-align:center}
.ptot{margin:10px 0 0 auto;width:min(300px,100%)}
.ptot div{display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid #e3e3dd}
.ptot .g{background:#151515;color:#F7C310;font-weight:700;font-size:15px;border:0;padding:8px}
.pw{margin-top:10px}
.terms{margin:14px 0 0;padding-left:20px;font-size:12px;color:#333}
.terms-h{font-weight:700;margin-top:16px}
.sig{display:flex;justify-content:space-between;margin-top:44px;gap:20px}
.sig div{flex:1;border-top:1.5px solid #151515;padding-top:5px;font-size:12.5px}
.sig div:last-child{text-align:right}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:grid;place-items:center;padding:20px}
.dlg{background:var(--surface);border-radius:12px;padding:20px;max-width:380px;width:100%}
.dlg p{margin:0 0 16px;font-size:17px}
.dlg .ba{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#151515;color:#fff;border-left:5px solid var(--yellow);padding:12px 16px;border-radius:8px;z-index:60;max-width:90%;font-weight:500}
.logoprev{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.logoprev img{width:72px;height:72px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.mod{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:112px}.mod b{font-family:var(--head);font-size:21px}.mod span:last-child{font-size:13.5px;color:var(--muted)}.mi{width:38px;height:38px;border-radius:9px;background:#16294D;color:#F7C310;display:grid;place-items:center;font-size:20px;margin-bottom:4px}.meta{color:var(--muted);font-size:14px}.hint{font-size:13.5px;color:var(--muted);margin:4px 0 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main><div class="wrap" id="view"></div></main>
<div id="barhost"></div>
<datalist id="works">
<option>Earthwork excavation</option><option>PCC</option><option>RCC footing</option><option>RCC column</option><option>RCC beam and slab</option><option>Brick masonry</option><option>Plastering</option><option>Flooring</option><option>Painting</option><option>Electrical work</option><option>Plumbing work</option><option>Roofing work</option>
</datalist>

const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2)};
const dispDate=iso=>{if(!iso)return"";const [y,m,d]=iso.split("-");return d+"/"+m+"/"+y};
const num=v=>parseFloat(v)||0;
function fmtP(p,cur){
  const neg=p<0;p=Math.abs(p);
  const r=Math.floor(p/100),ps=p%100;
  let s=r.toLocaleString("en-IN");
  if(ps)s+="."+pad(ps,2);
  const c=cur?(cur.length>1?cur+" ":cur):"";
  return (neg?"-":"")+c+s;
}
const money=p=>fmtP(p,settings.currency||"₹");
const pdfCur=()=>(settings.currency==="₹"||!settings.currency)?"Rs.":settings.currency;
const ONES=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const TENS=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
function w99(n){return n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?" "+ONES[n%10]:"")}
function w999(n){const h=Math.floor(n/100),r=n%100;return (h?ONES[h]+" Hundred"+(r?" ":""):"")+(r?w99(r):"")}
function inWords(n){
  if(n===0)return"Zero";
  const parts=[];
  const cr=Math.floor(n/1e7);n%=1e7;
  const la=Math.floor(n/1e5);n%=1e5;
  const th=Math.floor(n/1e3);n%=1e3;
  if(cr)parts.push(w999(cr)+" Crore");
  if(la)parts.push(w99(la)+" Lakh");
  if(th)parts.push(w99(th)+" Thousand");
  if(n)parts.push(w999(n));
  return parts.join(" ");
}
function amountWords(p){
  const r=Math.floor(p/100),ps=p%100;
  let s="Rupees "+inWords(r);
  if(ps)s+=" and "+inWords(ps)+" Paise";
  return s+" Only";
}
const CH_LABELS={labour:"Labour charges",transport:"Transportation",material:"Material charges",other:"Other charges",discount:"Discount"};
const UNITS=["Sq.ft","Sq.m","Cu.ft","Cu.m","R.ft","Nos","Kg","Ton","L.S.","Other"];
const unitOf=it=>it.unit==="Other"?(it.unitOther||"Other"):it.unit;

/* ---------- calculation (integer paise, decimal-safe) ---------- */
function calc(e){
  const rows=e.items.map(it=>({it,p:Math.round(num(it.qty)*num(it.rate)*100)}));
  const sub=rows.reduce((a,r)=>a+r.p,0);
  const ch={};let add=0;
  ["labour","transport","material","other"].forEach(k=>{const c=e.charges[k];ch[k]=c.on?Math.round(num(c.amt)*100):0;add+=ch[k]});
  const disc=e.charges.discount.on?Math.round(num(e.charges.discount.amt)*100):0;
  const taxable=Math.max(sub+add-disc,0);
  let gst=0,cgst=0,sgst=0,igst=0;
  if(e.gst.on){
    gst=Math.round(taxable*num(e.gst.rate)/100);
    if(e.gst.type==="igst")igst=gst;else{cgst=Math.floor(gst/2);sgst=gst-cgst}
  }
  return{rows,sub,ch,add,disc,taxable,gst,cgst,sgst,igst,total:taxable+gst};
}
const visibleRows=c=>c.rows.filter(r=>r.it.desc.trim()||r.p>0);
function totalLines(e,c,cur){
  const f=p=>fmtP(p,cur);
  const L=[["Subtotal",f(c.sub)]];
  Object.keys(CH_LABELS).forEach(k=>{if(k!=="discount"&&c.ch[k])L.push([CH_LABELS[k],f(c.ch[k])])});
  if(c.disc)L.push(["Discount","- "+f(c.disc)]);
  if(e.gst.on){
    const r=num(e.gst.rate);
    if(e.gst.type==="igst")L.push(["IGST ("+r+"%)",f(c.igst)]);
    else{L.push(["CGST ("+r/2+"%)",f(c.cgst)]);L.push(["SGST ("+r/2+"%)",f(c.sgst)])}
  }
  return L;
}

function upsert(e){
  e.updated=Date.now();

  saveEstimates();
}

const ico=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
function toast(m){const old=$(".toast");if(old)old.remove();const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3600)}
function confirmBox(msg,okText="Delete"){
  return new Promise(res=>{
    const o=document.createElement("div");o.className="ov";
    o.innerHTML=`<div class="dlg" role="alertdialog" aria-modal="true"><p>${esc(msg)}</p><div class="ba"><button class="btn alt sm" data-x="0">Cancel</button><button class="btn sm danger" data-x="1">${esc(okText)}</button></div></div>`;
    o.addEventListener("click",ev=>{const b=ev.target.closest("[data-x]");if(b){o.remove();res(b.dataset.x==="1")}else if(ev.target===o){o.remove();res(false)}});
    document.body.appendChild(o);$("[data-x='0']",o).focus();
  });
}
function go(v,opts){
  if(S.view==="editor"){
    flush();
    if(v!=="preview"&&S.est&&!estimates.some(x=>x.id===S.est.id)){const y=new Date().getFullYear();if(settings.seq&&settings.seq[y]>0){settings.seq[y]--;saveSettings()}S.est=null}
  }
  Object.assign(S,{view:v},opts||{});
  render();window.scrollTo(0,0);
}
function setTop(title,back){
  topEl.innerHTML=`<div class="wrap">${back?`<button class="iconbtn" data-act="back" aria-label="Back">${ico("back")}</button>`:`<span class="logochip" style="width:38px;height:38px;padding:2px;border-radius:6px"><img alt="" src="${esc(settings.logo)}"></span>`}<h1>${esc(title)}</h1>${back?"":`<button class="iconbtn" data-act="settings" aria-label="Settings">${ico("gear")}</button>`}</div>`;

/* ---------- list ---------- */
function inRange(e,L){
  const d=e.date;if(L.range==="all")return true;
  const now=new Date(),t=todayISO();
  if(L.range==="today")return d===t;
  if(L.range==="week"){const s=new Date(now);s.setDate(now.getDate()-((now.getDay()+6)%7));const sIso=s.getFullYear()+"-"+pad(s.getMonth()+1,2)+"-"+pad(s.getDate(),2);return d>=sIso&&d<=t}
  if(L.range==="month")return d.slice(0,7)===t.slice(0,7);
  if(L.range==="custom")return (!L.from||d>=L.from)&&(!L.to||d<=L.to);
  return true;
}
function filtered(){
  const L=S.list,q=L.q.trim().toLowerCase();
  return [...estimates].filter(e=>(L.status==="all"||e.status===L.status)&&inRange(e,L)&&(!q||[e.client,e.no,e.work,dispDate(e.date),e.location].join(" ").toLowerCase().includes(q))).sort((a,b)=>b.updated-a.updated);
}

function refreshTotals(){

  if(sc){
    sc.innerHTML=totalLines(e,c,settings.currency||"₹").map(([a,b])=>`<div class="sumrow"><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join("")+

/* ---------- PDF ---------- */
function buildPdf(e){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const c=calc(e),cur=pdfCur(),vr=visibleRows(c);
  const M=14,R=196,YEL=[247,195,16],INK=[21,21,21];
  let y=12;
  const lw=26,lh=lw*(settings.logoAspect||1);
  try{doc.addImage(settings.logo,"JPEG",M,y,lw,lh)}catch(err){}
  const tx=M+lw+6,tw=R-tx;
  doc.setFont("helvetica","bold").setFontSize(23).setTextColor(...INK);doc.text(settings.name,tx,y+8);
  doc.setFontSize(9).setTextColor(80,80,80);doc.text(String(settings.tagline||"").toUpperCase(),tx,y+13.5);
  doc.setFont("helvetica","normal").setFontSize(8.5).setTextColor(55,55,55);
  let yy=y+19;
  const al=doc.splitTextToSize(settings.address||"",tw);doc.text(al,tx,yy);yy+=al.length*4;
  contactLines().forEach(l=>{const t=doc.splitTextToSize(l,tw);doc.text(t,tx,yy);yy+=t.length*4});
  y=Math.max(yy,y+lh)+2;
  doc.setFillColor(...INK);doc.rect(M,y,R-M,1.2,"F");doc.setFillColor(...YEL);doc.rect(M,y+1.2,R-M,1.6,"F");
  y+=11;
  doc.setFont("helvetica","bold").setFontSize(16).setTextColor(...INK);doc.text("ESTIMATE",M,y);
  doc.setFontSize(9.5);doc.text("Estimate No: "+e.no,R,y-4,{align:"right"});doc.text("Date: "+dispDate(e.date),R,y+1,{align:"right"});
  y+=8;
  [["Client Name",e.client],["Work",e.work],["Location",e.location],["Client Phone",e.phone],["Prepared By",e.preparedBy]].forEach(([k,v],i)=>{
    if(i>0&&!v)return;
    doc.setFont("helvetica","bold").setFontSize(9.5).setTextColor(...INK);doc.text(k+":",M,y);
    doc.setFont("helvetica","normal");const t=doc.splitTextToSize(v||"-",R-M-32);doc.text(t,M+32,y);y+=Math.max(t.length,1)*4.6;
  });
  y+=2;
  doc.autoTable({
    startY:y,theme:"grid",
    head:[["S.No","Description of Work","Unit","Qty","Rate ("+cur+")","Amount ("+cur+")"]],
    body:vr.map((r,i)=>[i+1,r.it.desc,unitOf(r.it),num(r.it.qty).toLocaleString("en-IN"),fmtP(Math.round(num(r.it.rate)*100),""),fmtP(r.p,"")]),
    styles:{font:"helvetica",fontSize:9,cellPadding:2.2,lineColor:[205,205,198],lineWidth:0.2,textColor:[30,30,30],valign:"top"},
    headStyles:{fillColor:INK,textColor:YEL,fontStyle:"bold"},
    alternateRowStyles:{fillColor:[247,247,244]},
    columnStyles:{0:{cellWidth:13,halign:"center"},2:{cellWidth:18,halign:"center"},3:{cellWidth:22,halign:"right"},4:{cellWidth:27,halign:"right"},5:{cellWidth:31,halign:"right"}},
    margin:{left:M,right:M,top:16,bottom:18},showHead:"everyPage",rowPageBreak:"avoid",
    didDrawPage:d=>{if(d.pageNumber>1){doc.setFont("helvetica","bold").setFontSize(9).setTextColor(90,90,90);doc.text(settings.name+" - Estimate "+e.no+" (contd.)",M,10)}}
  });
  y=doc.lastAutoTable.finalY+6;
  const ensure=h=>{if(y+h>278){doc.addPage();y=18}};
  const lines=totalLines(e,c,cur);
  ensure(lines.length*6.5+22);
  const bw=86,x0=R-bw;
  doc.setFont("helvetica","normal").setFontSize(9.5).setTextColor(30,30,30);

  doc.setFillColor(...INK);doc.rect(x0,y+1,bw,9,"F");

    doc.setFont("helvetica","normal").setFontSize(8.8).setTextColor(50,50,50);
    tl.forEach((t,i)=>{const w=doc.splitTextToSize(t,R-M-8);ensure(w.length*4.2+2);doc.text((i+1)+".",M,y);doc.text(w,M+6,y);y+=w.length*4.2+1.4});
    y+=4;
  }

  doc.setDrawColor(...INK).setLineWidth(0.4);
  doc.line(M,y,M+70,y);doc.line(R-70,y,R,y);

  doc.text("For "+settings.name,M,y+5);doc.text("Client Signature",R,y+5,{align:"right"});
  doc.setFont("helvetica","normal");doc.text("Authorized Signature"+(settings.signatory?" - "+settings.signatory:""),M,y+10);
  if(e.client)doc.text(e.client,R,y+10,{align:"right"});
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal").setFontSize(8).setTextColor(130,130,130);doc.text(settings.name+"  |  "+e.no,M,290);doc.text("Page "+i+" of "+n,R,290,{align:"right"})}
  return doc;
}
function pdfName(e){return (e.no+"_"+(e.client||"estimate")).replace(/[^\w\-]+/g,"_")+".pdf"}
function makeBlob(e){
  if(!window.jspdf){toast("PDF library did not load. Check your connection and reload.");return null}
  try{return buildPdf(e).output("blob")}catch(err){console.error(err);toast("Could not create the PDF. Check the estimate details.");return null}
}
function setStatus(e,st,onlyFromDraft){
  const cur=estimates.find(x=>x.id===e.id)||e;
  if(onlyFromDraft&&cur.status!=="draft"&&!(st==="sent"&&cur.status==="completed"))return;
  if(st==="completed"&&cur.status==="sent")return;
  cur.status=st;e.status=st;upsert(cur);
}
async function savePdf(e){
  const blob=makeBlob(e);if(!blob)return false;
  const name=pdfName(e);
  let dl=null;
  try{dl=window.claude&&await window.claude.use("downloads")}catch(err){}
  if(dl){
    try{await dl.save({filename:name,data:blob});setStatus(e,"completed",true);toast("PDF saved: "+name);return true}
    catch(err){if(err&&err.code==="declined")return false;toast("Could not save the PDF here.");return false}
  }
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setStatus(e,"completed",true);toast("PDF ready: "+name);return true}
  catch(err){toast("Could not save the PDF here.");return false}
}
async function sharePdf(e){
  const blob=makeBlob(e);if(!blob)return;
  const name=pdfName(e);
  const file=new File([blob],name,{type:"application/pdf"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:"Estimate "+e.no,text:"Estimate "+e.no+" from "+settings.name});setStatus(e,"sent",true);toast("Estimate shared");return}
    catch(err){if(err&&err.name==="AbortError")return}
  }
  const ok=await savePdf(e);
  if(ok)toast("Saved. Send it from your Files or WhatsApp.");
}

let pendingLogo=null;
function readLogo(file){
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{
    const cv=document.createElement("canvas");const sc=Math.min(1,500/Math.max(img.width,img.height));
    cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
    pendingLogo={data:cv.toDataURL("image/jpeg",.9),aspect:cv.height/cv.width};
    $("#lp").src=pendingLogo.data;toast("Logo ready. Tap Save settings to apply.");
  };img.onerror=()=>toast("That file could not be read as an image.");img.src=fr.result};
  fr.readAsDataURL(file);
}

document.addEventListener("click",async ev=>{
  const chip=ev.target.closest("[data-range]");
  if(chip){S.list.range=chip.dataset.range;rList();return}
  const st=ev.target.closest("[data-st]");
  if(st){S.list.status=st.dataset.st;rList();return}
  const tab=ev.target.closest("[data-tab]");
  if(tab&&S.view==="editor"){S.tab=tab.dataset.tab;rEditor();return}
  const b=ev.target.closest("[data-act]");if(!b||b.tagName==="SELECT")return;
  const act=b.dataset.act;
  const card=b.closest("[data-id]");
  const id=card&&card.dataset.id;
  const item=S.est&&id&&S.est.items.find(x=>x.id===id);
  const est=id&&estimates.find(x=>x.id===id);
  switch(act){
    case "back":
      if(S.view==="preview")go("editor");
      else if(S.view==="editor"){flush();go("home")}
      else go("home");break;
    case "settings":go("settings");break;
    case "new":S.est=newEstimate();S.tab="details";S.dirty=false;go("editor");break;
    case "saved":S.list={status:"all",q:"",range:"all",from:"",to:""};go("list");break;
    case "drafts":S.list={status:"draft",q:"",range:"all",from:"",to:""};go("list");break;
    case "open":if(est){S.est=JSON.parse(JSON.stringify(est));S.tab="details";S.dirty=false;go("editor")}break;
    case "dup":if(est){const d=JSON.parse(JSON.stringify(est));d.id=uid();d.no=nextNo();d.date=todayISO();d.status="draft";d.created=Date.now();d.items.forEach(i=>i.id=uid());upsert(d);S.est=d;S.tab="details";S.dirty=false;go("editor");toast("Duplicated. Update the client details.")}break;
    case "pdf":if(est)savePdf(est);break;
    case "share":if(est)sharePdf(est);break;
    case "del":if(est&&await confirmBox("Delete estimate "+est.no+" for "+(est.client||"this client")+"?")){estimates=estimates.filter(x=>x.id!==est.id);saveEstimates();render();toast("Estimate deleted")}break;
    case "additem":{S.est.items.push(blankItem());changed();fillTab();document.querySelectorAll('[data-k="desc"]').forEach((n,i,a)=>{if(i===a.length-1)n.focus()});refreshTotals();$("#tabbody").scrollIntoView&&window.scrollTo(0,document.body.scrollHeight);updateTabCount();break}
    case "dupitem":if(item){const i=S.est.items.indexOf(item);S.est.items.splice(i+1,0,Object.assign({},item,{id:uid()}));changed();fillTab();refreshTotals();updateTabCount()}break;
    case "delitem":if(item){if(S.est.items.length===1){Object.assign(item,blankItem(),{id:item.id})}else S.est.items=S.est.items.filter(x=>x!==item);changed();fillTab();refreshTotals();updateTabCount()}break;
    case "tabnext":S.tab=S.tab==="details"?"items":S.tab==="items"?"charges":"items";rEditor();window.scrollTo(0,0);break;
    case "preview":
      if(!S.est.client.trim()){toast("Enter the client name first");S.tab="details";rEditor();const f=$('[data-f="client"]');f&&f.focus();return}
      flush();upsert(S.est);go("preview");break;
    case "editback":go("editor");break;
    case "pdfcur":await savePdf(S.est);break;
    case "sharecur":await sharePdf(S.est);break;
    case "savesettings":{
      view.querySelectorAll("[data-s]").forEach(el=>{const k=el.dataset.s;settings[k]=k==="gstOn"?el.value==="1":el.value});
      if(pendingLogo){settings.logo=pendingLogo.data;settings.logoAspect=pendingLogo.aspect;pendingLogo=null}
      saveSettings();toast("Settings saved");break}
    case "resetsettings":if(await confirmBox("Restore company details, logo and terms to R.N & CO defaults?","Restore")){const seq=settings.seq;settings=Object.assign({},DEF_SETTINGS,{seq});saveSettings();pendingLogo=null;rSettings();toast("Defaults restored")}break;
  }
});

const onField=ev=>{
  const t=ev.target;
  if(t.id==="q"){S.list.q=t.value;fillResults();return}
  if(t.id==="from"||t.id==="to"){S.list[t.id]=t.value;fillResults();return}
  if(t.dataset.act==="status"){
    const card=t.closest("[data-id]");const e=estimates.find(x=>x.id===card.dataset.id);
    if(e){e.status=t.value;upsert(e);render()}return;
  }
  if(S.view!=="editor")return;
  const e=S.est;
  if(t.dataset.f){e[t.dataset.f]=t.value;
    if(t.dataset.f==="no"||t.dataset.f==="client")$("#top h1").textContent=e.no;
  }else if(t.dataset.item){
    const it=e.items.find(x=>x.id===t.dataset.item);if(!it)return;
    it[t.dataset.k]=t.value;
    if(t.dataset.k==="unit"&&ev.type==="change"){changed();fillTab();refreshTotals();return}
  }else if(t.dataset.c){
    const c=e.charges[t.dataset.c];
    if(t.dataset.k==="on"){c.on=t.checked;changed();fillTab();refreshTotals();return}
    c.amt=t.value;
  }else if(t.dataset.g){
    const k=t.dataset.g;
    if(k==="on"){if(ev.type!=="change")return;e.gst.on=t.value==="1";changed();fillTab();refreshTotals();return}
    if(k==="type"){e.gst.type=t.value}else e.gst.rate=t.value;
  }else return;
  changed();refreshTotals();
};

async function toEstimate(it){
  const opts=[{t:"+ New estimate",e:null},...[...estimates].sort((a,b)=>b.updated-a.updated).slice(0,8).map(e=>({t:`${e.no} · ${e.client||"Untitled"} (${e.status})`,e}))];
  const ch=await pick("Add to which estimate?",opts);if(!ch)return;
  let e=ch.e;
  if(!e){e=newEstimate();e.items=[]}
  else if(e.status!=="draft"){
    if(!await confirmBox(`${e.no} is already ${e.status}. Create a revised copy and add the quantity there? The original stays unchanged.`,"Create revision"))return;
    const r=JSON.parse(JSON.stringify(e));r.id=uid();r.no=e.no+"-R"+(estimates.filter(x=>x.no.startsWith(e.no+"-R")).length+1);r.status="draft";r.items.forEach(i=>i.id=uid());e=r;
  }else e=JSON.parse(JSON.stringify(e));
  e.items=e.items.filter(i=>i.desc||i.qty);
  e.items.push({id:uid(),desc:it[0],unit:it[1],unitOther:"",qty:String(+(+it[2]).toFixed(3)),rate:""});
  upsert(e);S.est=e;S.tab="items";S.dirty=false;go("editor");toast("Quantity added. Enter the rate.");
}

const FD={strokes:[],redo:[],tool:"pen",color:"#16294D",w:3,grid:false,id:null,name:"Sketch",projectId:""};

function paintStroke(c,s){c.save();c.lineCap=c.lineJoin="round";c.strokeStyle=s.tool==="eraser"?"#fff":s.color;c.lineWidth=s.w*(s.tool==="hi"?5:s.tool==="eraser"?4:1);c.globalAlpha=s.tool==="hi"?.35:1;c.beginPath();s.pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));if(s.pts.length===1)c.lineTo(s.pts[0][0]+.1,s.pts[0][1]);c.stroke();c.restore()}
function redrawFD(){const cv=$("#fd"),c=cv.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,1000,700);if(FD.grid){c.strokeStyle="#dfe3ea";c.lineWidth=1;c.beginPath();for(let i=0;i<=1000;i+=25){c.moveTo(i,0);c.lineTo(i,700)}for(let j=0;j<=700;j+=25){c.moveTo(0,j);c.lineTo(1000,j)}c.stroke()}FD.strokes.forEach(s=>paintStroke(c,s))}
function bindCanvas(){
  const cv=$("#fd");let cur=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*1000/r.width,(e.clientY-r.top)*700/r.height]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);cur={tool:FD.tool,color:FD.color,w:FD.w,pts:[pt(e)]};FD.strokes.push(cur);FD.redo=[]};
  cv.onpointermove=e=>{if(!cur)return;const p=pt(e);cur.pts.push(p);if(cur.tool==="hi")redrawFD();else paintStroke(cv.getContext("2d"),{...cur,pts:cur.pts.slice(-2)})};
  const end=()=>{if(cur){cur=null;FD.dirty=true}};cv.onpointerup=cv.onpointercancel=end;redrawFD();
}
function roomGeom(d){const f=LU[d.unit],L=d.L*f,B=d.B*f;return{L,B,t:d.t/1000,sqm:L*B,sqft:L*B/.09290304}}
function roomSVG(d,wpx){
  const g=roomGeom(d),fit=d.scale==="fit",ppm=fit?Math.min((wpx-140)/g.L,360/g.B):1000/(+d.scale)*3.7795,P=64;
  const w=g.L*ppm,h=g.B*ppm,t=Math.max(g.t*ppm,2),W=w+2*P,Hh=h+2*P,dl=`${fx(d.L)} ${d.unit}`,bl=`${fx(d.B)} ${d.unit}`;
  const tk=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#16294D" stroke-width="1.5"/>`;
  const ty=P-t-20,lx=P-t-20;
  return `<svg viewBox="0 0 ${W} ${Hh}" ${fit?'width="100%"':`width="${W}"`} xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scaled room drawing" style="background:#fff;display:block;font-family:Barlow,Arial,sans-serif">
  <rect x="${P-t}" y="${P-t}" width="${w+2*t}" height="${h+2*t}" fill="#6b7a99"/><rect x="${P}" y="${P}" width="${w}" height="${h}" fill="#fff"/>
  ${tk(P,ty,P+w,ty)}${tk(P,ty-5,P,ty+5)}${tk(P+w,ty-5,P+w,ty+5)}<text x="${P+w/2}" y="${ty-6}" text-anchor="middle" font-size="14" font-weight="600" fill="#151515">${esc(dl)}</text>
  ${tk(lx,P,lx,P+h)}${tk(lx-5,P,lx+5,P)}${tk(lx-5,P+h,lx+5,P+h)}<text transform="translate(${lx-6} ${P+h/2}) rotate(-90)" text-anchor="middle" font-size="14" font-weight="600" fill="#151515">${esc(bl)}</text>
  <text x="${P+w/2}" y="${P+h/2-4}" text-anchor="middle" font-size="18" font-weight="700" fill="#151515">${esc(d.name)}</text>
  <text x="${P+w/2}" y="${P+h/2+18}" text-anchor="middle" font-size="13" fill="#444">${fx(g.sqft,2)} sq ft · ${fx(g.sqm,2)} sq m</text>
  <text x="${W-8}" y="${Hh-8}" text-anchor="end" font-size="12" fill="#444">${fit?"Fit to screen (not to scale)":"Scale 1:"+d.scale+" (at 96 dpi)"}</text></svg>`;
}

function roomPdf(d){
  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"}),g=roomGeom(d);
  sheetHead(doc,d.name+" - Room plan",sheetInfo(d));
  let S_=d.scale==="fit"?0:+d.scale,pw=S_?g.L*1000/S_:0,ph=S_?g.B*1000/S_:0,nts=!S_;
  const aw=250,ah=100;
  if(S_&&(pw>aw||ph>ah))nts=true;
  if(nts){const f=Math.min(aw/g.L,ah/g.B);pw=g.L*f;ph=g.B*f}
  const k=pw/g.L,x0=148-pw/2,y0=48+(ah-ph)/2,t=Math.max(g.t*k,.4);
  doc.setFillColor(107,122,153);doc.rect(x0-t,y0-t,pw+2*t,ph+2*t,"F");doc.setFillColor(255,255,255);doc.rect(x0,y0,pw,ph,"F");
  doc.setDrawColor(22,41,77).setLineWidth(.3);const ty=y0-t-6,lx=x0-t-6;
  doc.line(x0,ty,x0+pw,ty);doc.line(lx,y0,lx,y0+ph);
  doc.setFont("helvetica","bold").setFontSize(10).setTextColor(20,20,20);doc.text(`${fx(d.L)} ${d.unit}`,x0+pw/2,ty-1.5,{align:"center"});doc.text(`${fx(d.B)} ${d.unit}`,lx-2,y0+ph/2,{angle:90,align:"center"});
  doc.setFontSize(13);doc.text(d.name,x0+pw/2,y0+ph/2,{align:"center"});doc.setFont("helvetica","normal").setFontSize(10);doc.text(`${fx(g.sqft,2)} sq ft / ${fx(g.sqm,2)} sq m`,x0+pw/2,y0+ph/2+6,{align:"center"});
  doc.setFontSize(10).setFont("helvetica","bold");doc.text(nts?"NOT TO SCALE (fitted to page)":`Scale 1:${d.scale} (print at 100%)`,10,160);

  const b=ev.target.closest("[data-sa]");if(!b)return;
  const a=b.dataset.sa,v=b.dataset.v;
  const dc=b.closest("[data-did]"),d=dc&&ST.drawings.find(x=>x.id===dc.dataset.did);
  switch(a){
   case "go":if(v==="calc")CC={key:null,out:null};go(v);break;
   case "quickcalc":CC={key:"concrete",out:null};go("calc");break;
   case "cvcat":CV.cat=v;rConv();break;
   case "cvswap":[CV.from,CV.to]=[CV.to,CV.from];rConv();break;
   case "cvclear":CV.v="";rConv();break;
   case "cvcopy":if(CV.res){try{await navigator.clipboard.writeText(CV.res)}catch(e){}ST.hist=[CV.res,...(ST.hist||[])].slice(0,20);saveST();toast("Copied: "+CV.res);$("#cv_h").innerHTML=ST.hist.slice(0,6).map(h=>`<div class="meta" style="padding:3px 0">${esc(h)}</div>`).join("")}break;
   case "calcopen":CC={key:v,out:null};rCalc();break;
   case "calcreset":rCalc();break;
   case "calccopy":{const t=CAL[CC.key].n+": "+CC.out.res.map(r=>r.join(" ")).join(", ");try{await navigator.clipboard.writeText(t)}catch(e){}toast("Result copied");break}
   case "calcsave":{const o=ST.projects.map(p=>({t:p.name,p}));if(!o.length){toast("Create a project first");break}const c=await pick("Save to which project?",o);if(c){ST.calcs.push({id:uid(),projectId:c.p.id,name:CAL[CC.key].n,text:CC.out.res.map(r=>r.join(" ")).join(" · "),date:todayISO()});saveST();toast("Saved to "+c.p.name)}break}
   case "calcest":toEstimate(CC.out.est);break;
   case "dmode":DM=v;rDraw();break;
   case "ftool":FD.tool=v;rDraw();break;
   case "fundo":if(FD.strokes.length){FD.redo.push(FD.strokes.pop());redrawFD()}break;
   case "fredo":if(FD.redo.length){FD.strokes.push(FD.redo.pop());redrawFD()}break;
   case "fgrid":FD.grid=!FD.grid;b.setAttribute("aria-pressed",FD.grid);redrawFD();break;
   case "fclear":if(await confirmBox("Clear the whole canvas? You can undo each stroke only before clearing.","Clear")){FD.strokes=[];FD.redo=[];redrawFD()}break;
   case "fsave":FD.id=FD.id||uid();saveDrawing({id:FD.id,type:"free",name:FD.name,strokes:FD.strokes,grid:FD.grid,projectId:FD.projectId,updated:Date.now()});toast("Sketch saved");rDraw();break;
   case "fnew":Object.assign(FD,{strokes:[],redo:[],id:null,name:"Sketch",projectId:""});rDraw();break;
   case "fpng":$("#fd").toBlob(bl=>dlFile(safeName(FD.name)+".png",bl));break;
   case "fpdf":if(window.jspdf)dlFile(safeName(FD.name)+".pdf",freePdf().output("blob"));break;
   case "rsave":if(!(+RM.L>0&&+RM.B>0)){toast("Enter valid dimensions first");break}RM.id=RM.id||uid();saveDrawing({id:RM.id,type:"room",name:RM.name,d:{...RM},projectId:RM.projectId,updated:Date.now()});toast("Drawing saved");rDraw();break;
   case "rpdf":if(!(+RM.L>0&&+RM.B>0)){toast("Enter valid dimensions first");break}if(window.jspdf)dlFile(safeName(RM.name)+".pdf",roomPdf({...RM,L:+RM.L,B:+RM.B,t:+RM.t||0}).output("blob"));break;
   case "rnew":Object.assign(RM,{id:null,name:"Room",L:12,B:10,notes:"",projectId:""});rDraw();break;
   case "dopen":if(d){if(d.type==="free"){Object.assign(FD,{id:d.id,name:d.name,strokes:JSON.parse(JSON.stringify(d.strokes)),redo:[],grid:d.grid,projectId:d.projectId})}else Object.assign(RM,d.d,{id:d.id});DM=d.type;go("draw")}break;
   case "ddup":if(d){const c=JSON.parse(JSON.stringify(d));c.id=uid();c.name+=" copy";ST.drawings.push(c);saveST();rDraw()}break;
   case "ddel":if(d&&await confirmBox("Delete drawing “"+d.name+"”?")){ST.drawings=ST.drawings.filter(x=>x!==d);saveST();render()}break;
   case "pjnew":PJ.form=true;rProj();break;
   case "pjcancel":PJ.form=false;rProj();break;
   case "pjsave":{const n=$("#pj_n").value.trim();if(!n){toast("Enter a project name");break}ST.projects.push({id:uid(),name:n,client:$("#pj_c").value,phone:$("#pj_t").value,address:$("#pj_a").value,type:$("#pj_y").value});saveST();PJ.form=false;rProj();break}
   case "pjopen":PJ.id=b.closest("[data-pid]").dataset.pid;rProj();break;
   case "pjall":PJ.id=null;rProj();break;
   case "pjdel":{const p=ST.projects.find(x=>x.id===PJ.id);if(p&&await confirmBox("Delete project “"+p.name+"”? Its drawings and calculations will be unlinked, not deleted.")){ST.projects=ST.projects.filter(x=>x!==p);ST.drawings.forEach(x=>{if(x.projectId===p.id)x.projectId=""});ST.calcs.forEach(x=>{if(x.projectId===p.id)x.projectId=""});estimates.forEach(x=>{if(x.projectId===p.id)x.projectId=""});saveST();saveEstimates();PJ.id=null;rProj()}break}
  }
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="cv_v"){CV.v=t.value;updConv()}
  else if(t.id==="cv_a"){CV.from=t.value;updConv()}else if(t.id==="cv_b"){CV.to=t.value;updConv()}
  else if(t.dataset.cv||t.dataset.cu){runCalc()}
  else if(t.id==="fd_c")FD.color=t.value;else if(t.id==="fd_w")FD.w=+t.value;else if(t.id==="fd_n")FD.name=t.value;else if(t.id==="fd_p")FD.projectId=t.value;
  else if(t.dataset.rm){RM[t.dataset.rm]=t.value;updRoom()}
});

render();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
